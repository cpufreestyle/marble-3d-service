version: '3.8'

services:
  # Marble 3D Service 后端
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./uploads:/app/uploads
      - ./generated_3d_views:/app/backend/generated_3d_views
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # （可选）前端静态文件服务 - Nginx
  # frontend:
  #   image: nginx:alpine
  #   ports:
  #     - "8080:80"
  #   volumes:
  #     - ../frontend:/usr/share/nginx/html:ro
  #   depends_on:
  #     - backend
  #   restart: unless-stopped

networks:
  default:
    name: marble-3d-network
