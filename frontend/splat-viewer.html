<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Splats 查看器</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a; color: #fff; overflow: hidden; height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        #canvas-frame { position: fixed; inset: 0; }
        .toolbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 10;
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 16px; background: rgba(0,0,0,0.55); backdrop-filter: blur(8px);
        }
        .toolbar h1 { font-size: 0.9rem; font-weight: 500; color: #00d2ff; }
        .toolbar .badge {
            padding: 3px 10px; border-radius: 12px; font-size: 0.7rem;
            background: rgba(0,210,255,0.15); color: #00d2ff;
        }
        .btn {
            padding: 6px 14px; border: 1px solid rgba(255,255,255,0.15);
            border-radius: 6px; background: rgba(255,255,255,0.06); color: #fff;
            cursor: pointer; font-size: 0.8rem;
        }
        .btn:hover { background: rgba(255,255,255,0.12); }
        #status {
            position: fixed; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 12px; z-index: 20;
            background: #0a0a0a; transition: opacity 0.4s;
        }
        #status.hidden { opacity: 0; pointer-events: none; }
        .spinner {
            width: 44px; height: 44px; border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #00d2ff; border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #statusText { color: #888; font-size: 0.85rem; }
        #statusText.error { color: #ff6b6b; }
        .hint {
            position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
            color: #555; font-size: 0.7rem; z-index: 10;
        }
    </style>
</head>
<body>
    <div id="canvas-frame"></div>

    <div class="toolbar">
        <div style="display:flex;align-items:center;gap:10px;">
            <span class="badge">🧊 Gaussian Splats</span>
            <h1>3D 世界查看器</h1>
        </div>
        <button class="btn" onclick="window.close()">✕ 关闭</button>
    </div>

    <div id="status">
        <div class="spinner"></div>
        <div id="statusText">正在请求 PLY 导出并加载点云…</div>
    </div>

    <div class="hint">鼠标拖拽旋转 · 滚轮缩放 · 右键平移</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
    }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import * as GaussianSplats3D from
            'https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.min.js';

        const params = new URLSearchParams(window.location.search);
        const worldId = params.get('world');
        const statusEl = document.getElementById('statusText');
        const statusBox = document.getElementById('status');

        function setStatus(text, isError) {
            statusEl.textContent = text;
            statusEl.className = isError ? 'error' : '';
            if (isError || text.indexOf('完成') !== -1) {
                const spinner = statusBox.querySelector('.spinner');
                if (spinner) spinner.style.display = 'none';
            }
        }

        async function main() {
            if (!worldId) {
                setStatus('缺少 world 参数（?world=<world_id>）', true);
                return;
            }

            const viewer = new GaussianSplats3D.Viewer({
                cameraUp: [0, -1, 0],
                initialCameraPosition: [-2, 0, -4],
                initialCameraLookAt: [0, 0, 0],
                sharedMemoryForWorkers: false,
            });
            viewer.init();

            const plyUrl = '/api/splat-ply/' + encodeURIComponent(worldId);
            setStatus('下载并解析点云（首次可能需要转换）…');
            try {
                await viewer.addSplatScene(plyUrl, {
                    format: GaussianSplats3D.SceneFormat.Ply,
                    showLoadingUI: false,
                    progressiveLoad: false,
                });
                viewer.start();
                setStatus('加载完成', false);
                setTimeout(function () { statusBox.classList.add('hidden'); }, 600);
            } catch (e) {
                console.error('splat load failed:', e);
                setStatus('加载失败: ' + (e.message || e), true);
            }
        }

        main();
    </script>
</body>
</html>
